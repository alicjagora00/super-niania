<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F4FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Super Niania – projekt aplikacji</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#F6F4FF; --ink:#24203A; --muted:#5E5A72; --soft:#4A4560; --violet:#6C4CE0; --violet-ink:#4A3A9E; --link:#5B3FD0; --lilac:#E9E4FD; --lilac2:#F1EEFC; --line:#D9D1FA; --mint:#E2F5EC; --green:#17704A; --peach:#FFEDE5; --rust:#9A3A15; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #E9E4FD; }
  body { font-family: 'Nunito', system-ui, sans-serif; color: var(--ink); -webkit-tap-highlight-color: transparent; }
  a { color: var(--link); }
  button { font-family: inherit; cursor: pointer; }
  .wrap { max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; background: var(--bg); display: flex; flex-direction: column; position: relative; }
  .content { flex: 1; padding: calc(20px + env(safe-area-inset-top)) 20px 20px; display: flex; flex-direction: column; gap: 18px; }
  .head { display: flex; align-items: center; gap: 12px; }
  .back { width: 44px; height: 44px; border-radius: 14px; background: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 0; text-decoration: none; }
  h1 { margin: 0; font-size: 24px; font-weight: 800; }
  h2 { margin: 0; font-size: 17px; font-weight: 800; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .card { background: #fff; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 56px; border-radius: 16px; background: var(--violet); color: #fff; font-size: 17px; font-weight: 800; border: 0; text-decoration: none; width: 100%; }
  .btn.alt { background: #fff; color: var(--link); border: 2px solid var(--line); }
  .btn.soft { background: var(--lilac2); color: var(--violet-ink); height: 48px; font-size: 16px; }
  .bar { position: sticky; bottom: 0; background: #fff; border-top: 1px solid #ECE8FA; padding: 14px 20px calc(16px + env(safe-area-inset-bottom)); display: flex; gap: 14px; align-items: center; z-index: 5; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { padding: 8px 14px; border-radius: 999px; background: #fff; border: 1.5px solid var(--line); font-size: 14px; font-weight: 700; color: #3D2E8C; }
  .tog { height: 40px; padding: 0 14px; border-radius: 999px; background: #fff; border: 1.5px solid var(--line); font-size: 14px; font-weight: 700; color: #3D2E8C; display: inline-flex; align-items: center; gap: 6px; }
  .tog.on { background: var(--violet); border-color: var(--violet); color: #fff; font-weight: 800; }
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 800; }
  .b-green { background: var(--mint); color: var(--green); }
  .b-lilac { background: var(--lilac2); color: var(--violet-ink); font-weight: 700; }
  .b-peach { background: var(--peach); color: #8A3412; font-weight: 700; }
  .dot { width: 7px; height: 7px; border-radius: 999px; background: #1E9E63; }
  .avatar { border-radius: 18px; display: flex; align-items: center; justify-content: center; font-weight: 800; flex-shrink: 0; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--lilac); border-radius: 14px; }
  .seg button { height: 42px; border: 0; border-radius: 11px; background: transparent; color: var(--muted); font-size: 15px; font-weight: 700; }
  .seg button.on { background: #fff; color: var(--ink); font-weight: 800; box-shadow: 0 2px 8px rgba(60,40,140,.12); }
  .nanny { display: flex; gap: 14px; padding: 16px; background: #fff; border-radius: 18px; text-decoration: none; color: var(--ink); box-shadow: 0 4px 16px rgba(60,40,140,.06); }
  .nav { position: sticky; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr); background: #fff; border-top: 1px solid #ECE8FA; padding: 8px 8px calc(10px + env(safe-area-inset-bottom)); z-index: 5; }
  .nav a { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; color: var(--muted); font-size: 12px; font-weight: 700; text-decoration: none; }
  .nav a.on { color: var(--link); font-weight: 800; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label, .lbl { font-size: 13px; font-weight: 700; color: var(--muted); }
  .input { height: 48px; border-radius: 12px; border: 1.5px solid var(--line); padding: 0 14px; font-family: inherit; font-size: 16px; font-weight: 700; color: var(--ink); background: #fff; width: 100%; }
  textarea.input { height: auto; padding: 12px 14px; font-weight: 600; font-size: 15px; resize: none; }
  .step { display: flex; gap: 12px; align-items: center; background: #fff; border-radius: 16px; padding: 14px; }
  .num { width: 32px; height: 32px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 15px; font-weight: 800; }
  .stepper { display: flex; align-items: center; justify-content: space-between; }
  .stepper button { width: 44px; height: 44px; border: 0; border-radius: 12px; background: var(--lilac2); color: var(--violet-ink); font-size: 22px; font-weight: 800; }
  .slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .slot { height: 44px; border-radius: 12px; border: 1.5px solid #DCD6F2; background: #fff; color: var(--muted); font-size: 15px; font-weight: 700; }
  .slot.on { background: var(--green); border-color: var(--green); color: #fff; font-weight: 800; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day { height: 62px; border: 0; border-radius: 14px; background: #fff; color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .day.on { background: var(--violet); color: #fff; }
  .switch { display: flex; align-items: center; gap: 14px; padding: 16px; border: 0; border-radius: 18px; background: #fff; color: var(--ink); text-align: left; width: 100%; }
  .switch.on { background: var(--green); color: #fff; }
  .knob { width: 52px; height: 30px; border-radius: 999px; background: #DCD6F2; display: flex; align-items: center; padding: 3px; flex-shrink: 0; }
  .knob span { width: 24px; height: 24px; border-radius: 999px; background: #fff; }
  .switch.on .knob { background: #fff; justify-content: flex-end; }
  .switch.on .knob span { background: var(--green); }
  .map { position: relative; height: 100vh; height: 100dvh; overflow: hidden; background: #EEF1EA; }
  .pin { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px 0 4px; border: 0; border-radius: 999px; background: #fff; color: var(--ink); box-shadow: 0 4px 12px rgba(60,40,140,.18); font-size: 14px; font-weight: 800; }
  .pin .av { width: 32px; height: 32px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 13px; }
  .pin.on { background: var(--violet); color: #fff; box-shadow: 0 6px 16px rgba(60,40,140,.35); z-index: 2; }
  .pin.on .av { background: #fff !important; color: var(--violet-ink) !important; }
  .spin { width: 18px; height: 18px; border: 3px solid #D9D1FA; border-top-color: #6C4CE0; border-radius: 50%; animation: sp .8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .demo { text-align: center; font-size: 12px; color: var(--muted); padding: 10px 20px 4px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  var I = {
    back: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#24203A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
    check: function (c, s, w) { return '<svg width="' + (s || 14) + '" height="' + (s || 14) + '" viewBox="0 0 24 24" fill="none" stroke="' + (c || '#17704A') + '" stroke-width="' + (w || 3) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'; },
    star: '<svg width="14" height="14" viewBox="0 0 24 24" fill="#F5A524" stroke="#F5A524" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.9L12 3.5z"/></svg>',
    pinI: function (c) { return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="' + (c || '#6C4CE0') + '" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>'; },
    shield: function (c) { return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="' + c + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6l8-3z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>'; },
    idc: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17704A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="12" r="2.5"/><path d="M14 10h4M14 14h3"/></svg>',
    clock: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B5461C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    house: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M12 17s-3-1.8-3-3.8A1.7 1.7 0 0 1 12 12a1.7 1.7 0 0 1 3 1.2c0 2-3 3.8-3 3.8z"/></svg>',
    map: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4L3 6.5v13L9 17l6 2.5 6-2.5v-13L15 6.5 9 4z"/><path d="M9 4v13M15 6.5v13"/></svg>',
    upload: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#6C4CE0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>',
    camera: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#6C4CE0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
    search: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
    cal: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
    msg: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 15a2 2 0 0 1-2 2H8l-4 4V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z"/></svg>',
    user: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>'
  };

  var NIANIE = [
    { ini: 'MK', name: 'Magda, 26 l.', rate: 35, rating: '4,9', ops: '23 opinie', km: '1,2 km', now: 'Wolna od 17:30', later: 'Pn–Pt, 8:00–16:00', tag: 'Pierwsza pomoc', bg: '#E9E4FD', fg: '#4A3A9E', x: 62, y: 40 },
    { ini: 'KW', name: 'Kasia, 31 l.', rate: 40, rating: '5,0', ops: '41 opinii', km: '2,4 km', now: 'Wolna od 18:00', later: 'Pn, Śr, Pt', tag: 'Pedagog', bg: '#FFEDE5', fg: '#9A3A15', x: 24, y: 30 },
    { ini: 'TN', name: 'Pani Teresa, 58 l.', rate: 38, rating: '5,0', ops: '67 opinii', km: '4,0 km', now: 'Wolna od 16:00', later: 'Codziennie rano', tag: '20 lat doświadczenia', bg: '#E2F5EC', fg: '#17704A', x: 76, y: 58 },
    { ini: 'OL', name: 'Ola, 22 l.', rate: 30, rating: '4,8', ops: '12 opinii', km: '3,1 km', now: 'Wolna od 19:00', later: 'Weekendy', tag: 'Angielski', bg: '#FFF4D6', fg: '#7A5600', x: 22, y: 54 }
  ];

  var weekday = [], weekend = [];
  for (var j = 0; j < 16; j++) { weekday.push(j >= 10 && j <= 14); weekend.push(j >= 2 && j <= 9); }
  var S = {
    mode: 'teraz', sel: 0, hours: 4, sent: false, now: true, day: 2, rate: 35,
    reg: { step: 1, id: null, bank: '', file: '', howto: false, an: null, err: '' },
    form: {}, kids: 1, kidAges: [2], terms: false, parentErr: '', loginErr: '',
    grid: [0, 1, 2, 3, 4, 5, 6].map(function (i) { return (i >= 5 ? weekend : weekday).slice(); }),
    picked: {
      edu: ['W trakcie studiów pedagogicznych'], exp: ['3–5 lat'], age: ['1–3 lata', '3–6 lat'],
      act: ['Zabawy plastyczne', 'Czytanie bajek', 'Spacery i plac zabaw', 'Usypianie'],
      hob: ['Rysowanie', 'Przyroda'], extra: ['Kurs pierwszej pomocy', 'Nie palę']
    }
  };
  var GROUPS = [
    { key: 'edu', title: 'Wykształcenie', hint: 'wybierz 1', single: true, opts: ['Średnie', 'Studia pedagogiczne', 'W trakcie studiów pedagogicznych', 'Inne studia', 'Kurs opiekunki dziecięcej'] },
    { key: 'exp', title: 'Doświadczenie z dziećmi', hint: 'wybierz 1', single: true, opts: ['Do 1 roku', '1–3 lata', '3–5 lat', 'Ponad 5 lat'] },
    { key: 'age', title: 'Wiek dzieci', hint: 'możesz kilka', opts: ['Niemowlęta (0–1)', '1–3 lata', '3–6 lat', '6–10 lat', '10+ lat'] },
    { key: 'act', title: 'Co robię z dziećmi', hint: 'możesz kilka', opts: ['Zabawy plastyczne', 'Czytanie bajek', 'Spacery i plac zabaw', 'Pomoc w lekcjach', 'Gotowanie posiłków', 'Nauka angielskiego', 'Gry planszowe', 'Muzyka i śpiew', 'Sport i ruch', 'Usypianie'] },
    { key: 'hob', title: 'Moje zainteresowania', hint: 'możesz kilka', opts: ['Rysowanie', 'Muzyka', 'Sport', 'Książki', 'Przyroda', 'Taniec', 'Gotowanie', 'Języki obce'] },
    { key: 'extra', title: 'Dodatkowo', hint: 'możesz kilka', opts: ['Kurs pierwszej pomocy', 'Prawo jazdy', 'Własny samochód', 'Nie palę', 'Lubię zwierzęta', 'Opieka nad chorym dzieckiem'] },
    { key: 'where', title: 'Gdzie mogę się opiekować', hint: 'możesz kilka', opts: ['W domu rodziców', 'U siebie w domu', 'Odbiór z przedszkola / szkoły', 'Wyjazdy i wakacje'] }
  ];

  function fld(key, label, type, auto, ph) {
    return '<div class="field"><label for="f-' + key + '">' + label + '</label><input class="input" id="f-' + key + '" type="' + type + '" autocomplete="' + auto + '" data-field="' + key + '" value="' + esc(S.form[key] || '') + '" placeholder="' + (ph || '') + '"></div>';
  }
  function missing(list) {
    return list.filter(function (f) { return !(S.form[f[0]] || '').trim(); }).map(function (f) { return f[1]; });
  }
  function errBox(t) { return t ? '<div role="alert" style="background:#FDE8E8;color:#9B1C1C;border-radius:14px;padding:12px 14px;font-size:14px;font-weight:700">' + t + '</div>' : ''; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function startAnalysis(n) {
    if (S.reg.an !== null) return;
    S.reg.an = 0;
    (function tick() {
      setTimeout(function () {
        S.reg.an++;
        if (current === 'weryfikacja') render(true);
        if (S.reg.an < n) tick();
      }, 1100);
    })();
  }

  function back(to, label) { return '<a class="back" href="#' + to + '" aria-label="' + (label || 'Wróć') + '">' + I.back + '</a>'; }
  function nav(on) {
    var items = [['szukaj', 'Szukaj', I.search], ['rezerwacja', 'Rezerwacje', I.cal], ['profil', 'Wiadomości', I.msg], ['abonament', 'Konto', I.user]];
    return '<nav class="nav" aria-label="Menu główne">' + items.map(function (it) {
      return '<a href="#' + it[0] + '" class="' + (it[0] === on ? 'on' : '') + '">' + it[2] + it[1] + '</a>';
    }).join('') + '</nav>';
  }
  var DEMO = '<div class="demo">Projekt poglądowy – dane są przykładowe</div>';

  var screens = {
    start: function () {
      function row(bg, icon, t, s) {
        return '<div style="display:flex;gap:14px;align-items:flex-start"><div style="width:36px;height:36px;flex-shrink:0;border-radius:12px;background:' + bg + ';display:flex;align-items:center;justify-content:center">' + icon + '</div><div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:700">' + t + '</span><span class="muted" style="font-size:14px;line-height:1.4">' + s + '</span></div></div>';
      }
      return '<div class="content" style="gap:28px;padding-top:calc(40px + env(safe-area-inset-top))">' +
        '<div style="display:flex;align-items:center;gap:10px"><div style="width:44px;height:44px;border-radius:14px;background:#6C4CE0;display:flex;align-items:center;justify-content:center">' + I.house + '</div><span style="font-size:22px;font-weight:800">Super Niania</span></div>' +
        '<div style="display:flex;flex-direction:column;gap:12px"><h1 style="font-size:34px;line-height:1.12;letter-spacing:-.5px">Sprawdzona niania, kiedy jej potrzebujesz</h1><p class="muted" style="font-size:17px;line-height:1.5">Na stałe albo na już – nawet w ciągu 2 godzin. Każda niania przechodzi weryfikację, zanim ją zobaczysz.</p></div>' +
        '<div class="card" style="gap:16px;box-shadow:0 6px 24px rgba(60,40,140,.08)">' +
          row('#E2F5EC', I.idc, 'Potwierdzona tożsamość', 'Każda niania weryfikuje się przez bank') +
          row('#E2F5EC', I.shield('#17704A'), 'Niekaralność sprawdzona', 'Zaświadczenie z KRK i rejestr sprawców') +
          row('#FFEDE5', I.clock, 'Niania na teraz', 'Zobacz, kto jest wolny dziś w Twojej okolicy') +
        '</div>' +
        '<div style="flex:1"></div>' +
        '<div style="display:flex;flex-direction:column;gap:12px"><a class="btn" href="#rola">Zarejestruj się</a><a class="btn alt" href="#logowanie">Zaloguj się</a></div>' +
        '</div>' + DEMO;
    },

    rola: function () {
      function opt(href, act, bg, icon, t, s) {
        return '<a href="' + href + '"' + (act ? ' data-act="' + act + '"' : '') + ' class="card" style="flex-direction:row;align-items:center;gap:16px;text-decoration:none;color:#24203A;padding:20px;border:2px solid #E9E4FD">' +
          '<div style="width:56px;height:56px;border-radius:18px;background:' + bg + ';display:flex;align-items:center;justify-content:center;flex-shrink:0">' + icon + '</div>' +
          '<div style="flex:1;display:flex;flex-direction:column;gap:4px"><span style="font-size:19px;font-weight:800">' + t + '</span><span class="muted" style="font-size:14px;line-height:1.4">' + s + '</span></div>' +
          '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6C4CE0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></a>';
      }
      var parentIcon = '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#4A3A9E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="6" r="3"/><circle cx="17" cy="9" r="2"/><path d="M3 21v-3a5 5 0 0 1 10 0v3"/><path d="M14 21v-2a3 3 0 0 1 6 0v2"/></svg>';
      var nannyIcon = '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#17704A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>';
      return '<div class="content" style="gap:22px">' +
        '<div class="head">' + back('start') + '<h1>Zarejestruj się</h1></div>' +

          '<div style="display:flex;align-items:baseline;gap:6px"><span style="font-size:40px;font-weight:800;letter-spacing:-1px">19,99 zł</span><span style="font-size:15px;font-weight:600">/ miesiąc</span></div>' +
          ['Wszystkie zweryfikowane nianie', 'Niania na teraz – nawet za 2 godz.', 'Czat i rezerwacje bez limitu', 'Powiadomienie o wejściu i wyjściu niani'].map(function (t) { return feat(t, '#fff'); }).join('') + '</section>' +
        '<section style="background:#fff;border:2px solid #D9D1FA;border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-size:20px">Dla niani</h2><span class="badge b-green" style="font-size:12px">1. miesiąc gratis</span></div>' +
          '<div style="display:flex;align-items:baseline;gap:6px"><span style="font-size:40px;font-weight:800;letter-spacing:-1px">19,99 zł</span><span class="muted" style="font-size:15px;font-weight:600">/ miesiąc</span></div>' +
          ['Profil widoczny dla rodziców', 'Odznaka „Zweryfikowana”', 'Powiadomienia o nowych zleceniach', 'Kalendarz dostępności'].map(function (t) { return feat(t, '#17704A'); }).join('') +
          '<a class="btn soft" href="#weryfikacja">Zostań nianią</a></section>' +
        '<p class="muted small" style="text-align:center;line-height:1.5">Możesz zrezygnować w każdej chwili. Płatność kartą, BLIK lub Apple/Google Pay.</p>' +
        '</div>' + nav('abonament');
    },

    weryfikacja: function () {
      var R = S.reg, st = R.step, F = S.form;
      var titles = ['Dane podstawowe', 'Potwierdzenie tożsamości', 'Zaświadczenie o niekaralności', 'Analiza bezpieczeństwa', 'Twój profil'];
      var bar = '<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px" aria-hidden="true">' + [1, 2, 3, 4, 5].map(function (i) {
        return '<div style="height:6px;border-radius:9px;background:' + (i < st ? '#17704A' : i === st ? '#6C4CE0' : '#DCD6F2') + '"></div>';
      }).join('') + '</div>';
      var head = '<div class="head">' + (st > 1 ? '<button class="back" data-act="reg:back" aria-label="Poprzedni krok">' + I.back + '</button>' : back('start')) +
        '<div style="display:flex;flex-direction:column"><span class="lbl">Krok ' + st + ' z 5</span><h1 style="font-size:22px">' + titles[st - 1] + '</h1></div></div>';
      var err = R.err ? '<div role="alert" style="background:#FDE8E8;color:#9B1C1C;border-radius:14px;padding:12px 14px;font-size:14px;font-weight:700">' + R.err + '</div>' : '';
      function field(key, label, type, auto, ph) {
        return '<div class="field"><label for="f-' + key + '">' + label + '</label><input class="input" id="f-' + key + '" type="' + type + '" autocomplete="' + auto + '" data-field="' + key + '" value="' + esc(F[key] || '') + '" placeholder="' + (ph || '') + '"></div>';
      }
      var body = '', bottom = '';

      if (st === 1) {
        body = '<p class="muted" style="font-size:15px;line-height:1.5">Te dane widzi tylko zespół Super Niani. Rodzice zobaczą wyłącznie Twoje imię i dzielnicę.</p>' +
          '<div class="card" style="gap:14px">' +
            '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">' + field('imie', 'Imię', 'text', 'given-name') + field('nazwisko', 'Nazwisko', 'text', 'family-name') + '</div>' +
            field('ur', 'Data urodzenia', 'date', 'bday') +
            field('tel', 'Telefon', 'tel', 'tel', '+48 600 000 000') +
            field('email', 'E-mail', 'email', 'email', 'twoj@email.pl') +
            field('haslo', 'Hasło (min. 8 znaków)', 'password', 'new-password') +
          '</div>' +
          '<h2>Adres zamieszkania</h2>' +
          '<div class="card" style="gap:14px">' +
            field('ulica', 'Ulica i numer domu / mieszkania', 'text', 'street-address', 'np. Lipowa 5/12') +
            '<div style="display:grid;grid-template-columns:2fr 3fr;gap:12px">' + field('kod', 'Kod pocztowy', 'text', 'postal-code', '20-000') + field('miasto', 'Miasto', 'text', 'address-level2', 'Lublin') + '</div>' +
          '</div>' + err;
        bottom = '<button class="btn" data-act="reg:next">Dalej</button>';
      }

      if (st === 2) {
        var banks = ['PKO BP', 'Pekao', 'mBank', 'ING', 'Santander', 'Millennium', 'Alior', 'Inny bank'];
        if (R.id === 'ok') {
          body = '<div class="card" style="align-items:center;text-align:center;gap:12px;padding:24px"><div style="width:72px;height:72px;border-radius:24px;background:#E2F5EC;display:flex;align-items:center;justify-content:center">' + I.check('#17704A', 36, 2.6) + '</div>' +
            '<h2 style="font-size:20px">Tożsamość potwierdzona</h2>' +
            '<p class="muted" style="font-size:15px;line-height:1.5">Bank potwierdził, że jesteś <b style="color:#24203A">' + esc(((F.imie || '') + ' ' + (F.nazwisko || '')).trim() || 'osobą z formularza') + '</b>. Dane zgadzają się z tymi z kroku 1.</p>' +
            '<span class="badge b-green">' + I.check('#17704A', 12) + 'Potwierdzone przez ' + esc(R.bank) + '</span></div>';
          bottom = '<button class="btn" data-act="reg:next">Dalej</button>';
        } else if (R.id === 'loading') {
          body = '<div class="card" style="align-items:center;text-align:center;gap:14px;padding:32px"><div class="spin" style="width:40px;height:40px;border-width:4px"></div><h2>Łączymy z ' + esc(R.bank) + '…</h2><p class="muted" style="font-size:14px">Zaloguj się w swoim banku i potwierdź udostępnienie danych.</p></div>';
        } else {
          body = '<p class="muted" style="font-size:15px;line-height:1.5">Potwierdź, że to naprawdę Ty – logując się do swojego banku, tak jak przy płatności online. Nie widzimy Twojego hasła ani pieniędzy, bank przekazuje nam tylko imię, nazwisko i PESEL.</p>' +
            '<h2>Wybierz swój bank</h2>' +
            '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">' + banks.map(function (b, i) {
              return '<button data-act="bank:' + i + '" style="height:58px;border-radius:16px;border:1.5px solid #D9D1FA;background:#fff;color:#24203A;font-size:16px;font-weight:800">' + b + '</button>';
            }).join('') + '</div>' +
            '<div class="card" style="flex-direction:row;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:#F1EEFC"><span style="flex-shrink:0">' + I.shield('#4A3A9E') + '</span><span style="font-size:14px;line-height:1.45;color:#3D2E8C">Połączenie jest szyfrowane. Nie przechowujemy skanów dowodu osobistego.</span></div>';
        }
        S._banks = banks;
      }

      if (st === 3) {
        var steps = ['Wejdź na stronę e-KRK Ministerstwa Sprawiedliwości.', 'Zaloguj się profilem zaufanym albo e-dowodem.', 'Wybierz „Wniosek o udzielenie informacji o osobie” i wypełnij swoje dane.', 'Opłać wniosek online.', 'Pobierz gotowe e-zaświadczenie (plik PDF) i dodaj je tutaj.'];
        body = '<p class="muted" style="font-size:15px;line-height:1.5">Dodaj elektroniczne zaświadczenie z Krajowego Rejestru Karnego (plik PDF). Sprawdzimy jego podpis elektroniczny, więc nie da się go podrobić.</p>' +
          (R.file
            ? '<div class="card" style="flex-direction:row;align-items:center;gap:12px;border:2px solid #17704A"><div style="width:44px;height:44px;border-radius:14px;background:#E2F5EC;display:flex;align-items:center;justify-content:center;flex-shrink:0">' + I.check('#17704A', 22) + '</div><div style="flex:1;min-width:0;display:flex;flex-direction:column"><span style="font-size:15px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(R.file) + '</span><span class="small" style="color:#17704A;font-weight:700">Plik dodany</span></div><label style="font-size:14px;font-weight:800;color:#5B3FD0;cursor:pointer">Zmień<input type="file" accept="application/pdf,.pdf" data-file style="display:none"></label></div>'
            : '<label style="height:130px;border-radius:16px;border:2px dashed #B9ACF0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#4A3A9E;cursor:pointer">' + I.upload + '<span style="font-size:16px;font-weight:800">Dodaj plik PDF</span><span class="muted small">z telefonu albo komputera</span><input type="file" accept="application/pdf,.pdf" data-file style="display:none"></label>') +
          '<button data-act="reg:howto" style="background:none;border:0;padding:0;text-align:left;color:#5B3FD0;font-size:15px;font-weight:800">' + (R.howto ? 'Ukryj instrukcję' : 'Jak pobrać zaświadczenie? Pokażemy krok po kroku') + '</button>' +
          (R.howto ? '<div class="card" style="gap:12px">' + steps.map(function (s, i) {
            return '<div style="display:flex;gap:12px;align-items:flex-start"><div class="num" style="width:28px;height:28px;font-size:14px;background:#F1EEFC;color:#4A3A9E">' + (i + 1) + '</div><span style="font-size:14px;line-height:1.45">' + s + '</span></div>';
          }).join('') + '<span class="muted small">Zajmuje to zwykle ok. 15 minut.</span></div>' : '') + err;
        bottom = '<button class="btn" data-act="reg:next">Wyślij do analizy</button>';
      }

      if (st === 4) {
        var checks = ['Zgodność danych z bankiem', 'Autentyczność zaświadczenia (podpis elektroniczny)', 'Brak wpisów w Krajowym Rejestrze Karnym', 'Brak wpisu w rejestrze sprawców przestępstw na tle seksualnym', 'Ukończone 18 lat'];
        var doneAll = R.an >= checks.length;
        body = (doneAll
            ? '<div class="card" style="align-items:center;text-align:center;gap:12px;padding:24px;background:#17704A;color:#fff"><div style="width:72px;height:72px;border-radius:24px;background:#fff;display:flex;align-items:center;justify-content:center">' + I.shield('#17704A').replace(/width="20" height="20"/, 'width="40" height="40"') + '</div><h2 style="font-size:22px">Wszystko w porządku!</h2><p style="font-size:15px;line-height:1.5">Przeszłaś weryfikację. Na Twoim profilu pojawi się odznaka <b>„Zweryfikowana”</b>.</p></div>'
            : '<p class="muted" style="font-size:15px;line-height:1.5">Sprawdzamy Twoje dokumenty. To potrwa chwilę – nie zamykaj aplikacji.</p>') +
          '<div class="card" style="gap:16px">' + checks.map(function (c, i) {
            var icon = i < R.an ? '<div class="num" style="width:28px;height:28px;background:#E2F5EC">' + I.check('#17704A', 14) + '</div>'
              : i === R.an ? '<div style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;flex-shrink:0"><div class="spin"></div></div>'
              : '<div class="num" style="width:28px;height:28px;background:#EEECF4"></div>';
            var state = i < R.an ? '<span class="small" style="color:#17704A;font-weight:800">OK</span>' : i === R.an ? '<span class="small" style="color:#5B3FD0;font-weight:800">Sprawdzam…</span>' : '';
            return '<div style="display:flex;gap:12px;align-items:center">' + icon + '<span style="flex:1;font-size:15px;font-weight:700;' + (i > R.an ? 'color:#6B6680' : '') + '">' + c + '</span>' + state + '</div>';
          }).join('') + '</div>';
        bottom = doneAll ? '<a class="btn" href="#profilniani">Dalej: uzupełnij profil</a>' : '<button class="btn" style="opacity:.55" disabled>Trwa analiza…</button>';
        startAnalysis(checks.length);
      }

      return '<div class="content">' + head + bar + body + '</div>' + (bottom ? '<div class="bar">' + bottom + '</div>' : '');
    },

    profilniani: function () {
      return '<div class="content" style="gap:20px">' +
        '<div class="head">' + back('weryfikacja') + '<div style="display:flex;flex-direction:column"><span class="lbl">Krok 5 z 5</span><h1 style="font-size:22px">Twój profil</h1></div></div>' +
        '<div style="display:flex;gap:14px;align-items:center"><div style="width:76px;height:76px;border-radius:24px;background:#E9E4FD;display:flex;align-items:center;justify-content:center;flex-shrink:0">' + I.camera + '</div><div style="display:flex;flex-direction:column;gap:6px"><button class="btn" style="height:40px;font-size:15px;width:auto;padding:0 14px;border-radius:12px">Dodaj zdjęcie</button><span class="muted small">Uśmiechnięte zdjęcie twarzy buduje zaufanie</span></div></div>' +
        '<div class="field"><label for="om" style="font-size:16px;font-weight:800;color:#24203A">O mnie</label><textarea class="input" id="om" rows="3">Studiuję pedagogikę przedszkolną. Od 4 lat opiekuję się dziećmi.</textarea></div>' +
        GROUPS.map(function (g, gi) {
          var picked = S.picked[g.key] || [];
          return '<div style="display:flex;flex-direction:column;gap:10px"><div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:16px;font-weight:800">' + g.title + '</span><span class="muted small">' + g.hint + '</span></div><div class="chips">' +
            g.opts.map(function (o, oi) {
              var on = picked.indexOf(o) >= 0;
              return '<button class="tog ' + (on ? 'on' : '') + '" data-act="pick:' + gi + ':' + oi + '" aria-pressed="' + on + '">' + (on ? I.check('#fff', 14, 3.2) : '') + o + '</button>';
            }).join('') + '</div></div>';
        }).join('') +
        '<div class="card"><span style="font-size:16px;font-weight:800">Moja stawka</span><div class="stepper"><button data-act="rate:-1" aria-label="Obniż stawkę" style="width:52px;height:52px;border-radius:16px;font-size:24px">−</button><div style="display:flex;flex-direction:column;align-items:center"><span style="font-size:34px;font-weight:800;letter-spacing:-.5px">' + S.rate + ' zł</span><span class="muted small">za godzinę</span></div><button data-act="rate:1" aria-label="Podnieś stawkę" style="width:52px;height:52px;border-radius:16px;font-size:24px">+</button></div>' +
        '<span class="muted small" style="text-align:center">Ustalasz ją sama i możesz ją zmienić w każdej chwili. Rodzic płaci Ci bezpośrednio.</span></div>' +
        '</div><div class="bar"><a class="btn" href="#kalendarz">Dalej: moja dostępność</a></div>';
    },

    kalendarz: function () {
      var names = ['Pn', 'Wt', 'Śr', 'Cz', 'Pt', 'So', 'Nd'];
      var full = ['poniedziałek', 'wtorek', 'środa', 'czwartek', 'piątek', 'sobota', 'niedziela'];
      var row = S.grid[S.day];
      var count = row.filter(Boolean).length;
      return '<div class="content">' +
        '<div class="head">' + back('profilniani') + '<h1>Moja dostępność</h1></div>' +
        '<button class="switch ' + (S.now ? 'on' : '') + '" data-act="now" aria-pressed="' + S.now + '"><div style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:17px;font-weight:800">' + (S.now ? 'Jestem dostępna teraz' : 'Teraz niedostępna') + '</span><span style="font-size:14px;font-weight:600;' + (S.now ? '' : 'color:#5E5A72') + '">' + (S.now ? 'Rodzice w okolicy widzą Cię w „Niania na teraz”' : 'Włącz, gdy możesz przyjąć zlecenie od ręki') + '</span></div><div class="knob"><span></span></div></button>' +
        '<h2>Plan tygodnia</h2>' +
        '<div class="days">' + names.map(function (n, i) { return '<button class="day ' + (i === S.day ? 'on' : '') + '" data-act="day:' + i + '"><span style="font-size:12px;font-weight:700">' + n + '</span><span style="font-size:17px;font-weight:800">' + (23 + i) + '</span></button>'; }).join('') + '</div>' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="muted" style="font-size:14px">Wolne godziny – ' + full[S.day] + '</span><div style="display:flex;gap:6px"><button data-act="all:1" style="height:34px;padding:0 10px;border:0;border-radius:10px;background:#F1EEFC;color:#4A3A9E;font-size:13px;font-weight:800">Cały dzień</button><button data-act="all:0" style="height:34px;padding:0 10px;border:0;border-radius:10px;background:#fff;color:#5E5A72;font-size:13px;font-weight:800">Wyczyść</button></div></div>' +
        '<span class="muted small">Każde pole to 1 godzina, np. 17:00 = 17:00–18:00</span>' +
        '<div class="slots">' + row.map(function (on, j) { return '<button class="slot ' + (on ? 'on' : '') + '" data-act="slot:' + j + '" aria-pressed="' + on + '">' + (7 + j) + ':00</button>'; }).join('') + '</div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><a href="#profilniani" class="card" style="padding:14px;border-radius:16px;gap:2px;text-decoration:none;color:#24203A"><span class="lbl">Moja stawka (zmień)</span><span style="font-size:20px;font-weight:800">' + S.rate + ' zł/h</span></a><div class="card" style="padding:14px;border-radius:16px;gap:2px"><span class="lbl">Dojadę do</span><span style="font-size:20px;font-weight:800">5 km</span></div></div>' +
        '</div><div class="bar"><a class="btn" href="#start">Zapisz – ' + count + ' h w tym dniu</a></div>';
    }
  };

  var app = document.getElementById('app');
  var current = null;
  function render(keepScroll) {
    var name = (location.hash || '#start').slice(1);
    if (!screens[name]) name = 'start';
    var y = window.scrollY;
    app.innerHTML = '<div class="wrap">' + screens[name]() + '</div>';
    if (keepScroll && name === current) window.scrollTo(0, y); else window.scrollTo(0, 0);
    current = name;
  }

  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var p = el.getAttribute('data-act').split(':');
    var a = p[0], v = p[1];
    if (a === 'mode') S.mode = v;
    else if (a === 'sel') S.sel = +v;
    else if (a === 'h') S.hours = Math.min(12, Math.max(1, S.hours + (+v)));
    else if (a === 'send') S.sent = true;
    else if (a === 'unsend') S.sent = false;
    else if (a === 'rate') S.rate = Math.min(150, Math.max(20, S.rate + (+v)));
    else if (a === 'now') S.now = !S.now;
    else if (a === 'day') S.day = +v;
    else if (a === 'slot') S.grid[S.day][+v] = !S.grid[S.day][+v];
    else if (a === 'all') S.grid[S.day] = S.grid[S.day].map(function () { return v === '1'; });
    else if (a === 'kids') S.kids = Math.min(8, Math.max(1, S.kids + (+v)));
    else if (a === 'age') { var ai = +v; S.kidAges = S.kidAges.indexOf(ai) >= 0 ? S.kidAges.filter(function (x) { return x !== ai; }) : S.kidAges.concat([ai]); }
    else if (a === 'terms') { if (e.target.closest('a')) return; S.terms = !S.terms; }
    else if (a === 'parent') {
      var pb = missing([['p_imie', 'imię'], ['p_nazwisko', 'nazwisko'], ['p_tel', 'telefon'], ['p_email', 'e-mail'], ['p_haslo', 'hasło'], ['p_miasto', 'miasto']]);
      if (pb.length) S.parentErr = 'Uzupełnij: ' + pb.join(', ') + '.';
      else if (!S.terms) S.parentErr = 'Zaakceptuj regulamin, żeby założyć konto.';
      else { S.parentErr = ''; location.hash = '#abonament'; return; }
    }
    else if (a === 'login') {
      if (missing([['l_email', 'e-mail'], ['l_haslo', 'hasło']]).length) S.loginErr = 'Wpisz e-mail i hasło.';
      else { S.loginErr = ''; location.hash = '#szukaj'; return; }
    }
    else if (a === 'reg') {
      var R = S.reg, F = S.form;
      R.err = '';
      if (v === 'reset') { if (R.an === null || R.an >= 5) { S.reg = { step: 1, id: null, bank: '', file: '', howto: false, an: null, err: '' }; } return; }
      if (v === 'back') R.step = Math.max(1, R.step - 1);
      else if (v === 'howto') R.howto = !R.howto;
      else if (v === 'next') {
        if (R.step === 1) {
          var brak = missing([['imie', 'imię'], ['nazwisko', 'nazwisko'], ['tel', 'telefon'], ['email', 'e-mail'], ['haslo', 'hasło'], ['ulica', 'adres'], ['miasto', 'miasto']]);
          if (brak.length) R.err = 'Uzupełnij: ' + brak.join(', ') + '.'; else R.step = 2;
        } else if (R.step === 2) { if (R.id === 'ok') R.step = 3; }
        else if (R.step === 3) { if (!R.file) R.err = 'Dodaj plik PDF z zaświadczeniem, żeby przejść dalej.'; else R.step = 4; }
      }
    }
    else if (a === 'bank') {
      S.reg.bank = S._banks[+v]; S.reg.id = 'loading';
      setTimeout(function () { S.reg.id = 'ok'; if (current === 'weryfikacja') render(true); }, 1800);
    }
    else if (a === 'pick') {
      var g = GROUPS[+v], o = g.opts[+p[2]], cur = S.picked[g.key] || [];
      if (g.single) S.picked[g.key] = [o];
      else S.picked[g.key] = cur.indexOf(o) >= 0 ? cur.filter(function (x) { return x !== o; }) : cur.concat([o]);
    }
    render(true);
  });
  app.addEventListener('input', function (e) {
    var f = e.target.getAttribute && e.target.getAttribute('data-field');
    if (f) S.form[f] = e.target.value;
  });
  app.addEventListener('change', function (e) {
    if (e.target.hasAttribute && e.target.hasAttribute('data-file') && e.target.files && e.target.files[0]) {
      S.reg.file = e.target.files[0].name; S.reg.err = '';
      render(true);
    }
  });
  window.addEventListener('hashchange', function () { render(false); });
  render(false);
})();
</script>
</body>
</html>
